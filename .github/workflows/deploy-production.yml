name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      deploy_api:
        description: "Deploy API to production (promotes staging artifact)"
        type: boolean
        default: true
      deploy_intake:
        description: "Deploy Intake SWA to production"
        type: boolean
        default: true
      deploy_manager:
        description: "Deploy Manager SWA to production"
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

jobs:
  # ---------------------------------------------------------------------------
  # Resolve the staging run that produced the artifacts to promote
  # ---------------------------------------------------------------------------
  resolve-staging-run:
    name: Resolve Staging Artifacts
    if: inputs.deploy_api || inputs.deploy_intake || inputs.deploy_manager
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      api_run_id: ${{ steps.find.outputs.api_run_id }}
      intake_run_id: ${{ steps.find.outputs.intake_run_id }}
      intake_artifact: ${{ steps.find.outputs.intake_artifact }}
      manager_run_id: ${{ steps.find.outputs.manager_run_id }}
      manager_artifact: ${{ steps.find.outputs.manager_artifact }}
    steps:
      - name: Find newest successful staging run carrying each selected artifact
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEPLOY_API: ${{ inputs.deploy_api }}
          DEPLOY_INTAKE: ${{ inputs.deploy_intake }}
          DEPLOY_MANAGER: ${{ inputs.deploy_manager }}
        run: |
          # deploy-staging only builds apps whose paths changed, so the latest successful
          # run can carry no artifacts. Resolve each app to the newest run that built it.
          RUNS=$(gh api "/repos/$REPO/actions/workflows/deploy-staging.yml/runs?branch=main&status=success&per_page=50" \
            --jq '.workflow_runs[].id')

          find_artifact() {
            for RUN_ID in $RUNS; do
              NAME=$(gh api "/repos/$REPO/actions/runs/$RUN_ID/artifacts" \
                --jq "[.artifacts[] | select(.expired == false) | select(.name | startswith(\"$1\"))][0].name // empty")
              if [ -n "$NAME" ]; then echo "$RUN_ID $NAME"; return 0; fi
            done
            return 1
          }

          for APP in "api:api-publish:$DEPLOY_API" "intake:intake-wwwroot-:$DEPLOY_INTAKE" "manager:manager-wwwroot-:$DEPLOY_MANAGER"; do
            IFS=: read -r KEY PREFIX WANT <<< "$APP"
            [ "$WANT" = "true" ] || continue
            if ! RESULT=$(find_artifact "$PREFIX"); then
              echo "::error::No unexpired '$PREFIX' artifact in the last 50 successful deploy-staging runs on main."
              exit 1
            fi
            echo "${KEY}_run_id=${RESULT%% *}" >> "$GITHUB_OUTPUT"
            echo "${KEY}_artifact=${RESULT#* }" >> "$GITHUB_OUTPUT"
            echo "$KEY: staging run ${RESULT%% *}, artifact ${RESULT#* }"
          done

  # ---------------------------------------------------------------------------
  # Deploy API to production (artifact promotion — never rebuilds)
  # ---------------------------------------------------------------------------
  deploy-api:
    name: Deploy API to Production
    if: inputs.deploy_api
    needs: resolve-staging-run
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
      actions: read
    concurrency:
      group: deploy-production-api
      cancel-in-progress: false
    steps:
      - name: Download API artifact from staging run
        uses: actions/download-artifact@v4
        with:
          name: api-publish
          path: ./api
          run-id: ${{ needs.resolve-staging-run.outputs.api_run_id }}
          github-token: ${{ github.token }}

      - name: Login to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API to production
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.API_APP_SERVICE_NAME }}
          package: ./api

      - name: Azure logout
        if: always()
        run: az logout

  # ---------------------------------------------------------------------------
  # Deploy Intake SWA to production
  # ---------------------------------------------------------------------------
  deploy-intake:
    name: Deploy Intake SWA to Production
    if: inputs.deploy_intake
    needs: resolve-staging-run
    runs-on: ubuntu-latest
    environment: production
    permissions:
      actions: read
    concurrency:
      group: deploy-production-intake
      cancel-in-progress: false
    steps:
      - name: Download Intake artifact from staging run
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.resolve-staging-run.outputs.intake_artifact }}
          path: ./publish/intake/wwwroot
          run-id: ${{ needs.resolve-staging-run.outputs.intake_run_id }}
          github-token: ${{ github.token }}

      - name: Set blazor-environment to Production
        run: |
          CONFIG="./publish/intake/wwwroot/staticwebapp.config.json"
          echo "Before:"
          grep blazor-environment "$CONFIG"
          sed -i 's/"blazor-environment": "Staging"/"blazor-environment": "Production"/' "$CONFIG"
          echo "After:"
          grep blazor-environment "$CONFIG"

      - name: Deploy Intake to production
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.INTAKE_SWA_TOKEN_PRODUCTION }}
          repo_token: ${{ github.token }}
          action: upload
          app_location: ./publish/intake/wwwroot
          skip_app_build: true

  # ---------------------------------------------------------------------------
  # Deploy Manager SWA to production
  # ---------------------------------------------------------------------------
  deploy-manager:
    name: Deploy Manager SWA to Production
    if: inputs.deploy_manager
    needs: resolve-staging-run
    runs-on: ubuntu-latest
    environment: production
    permissions:
      actions: read
    concurrency:
      group: deploy-production-manager
      cancel-in-progress: false
    steps:
      - name: Download Manager artifact from staging run
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.resolve-staging-run.outputs.manager_artifact }}
          path: ./publish/manager/wwwroot
          run-id: ${{ needs.resolve-staging-run.outputs.manager_run_id }}
          github-token: ${{ github.token }}

      - name: Set blazor-environment to Production
        run: |
          CONFIG="./publish/manager/wwwroot/staticwebapp.config.json"
          echo "Before:"
          grep blazor-environment "$CONFIG"
          sed -i 's/"blazor-environment": "Staging"/"blazor-environment": "Production"/' "$CONFIG"
          echo "After:"
          grep blazor-environment "$CONFIG"

      - name: Deploy Manager to production
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.MANAGER_SWA_TOKEN_PRODUCTION }}
          repo_token: ${{ github.token }}
          action: upload
          app_location: ./publish/manager/wwwroot
          skip_app_build: true
