name: Build & Test

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    concurrency:
      group: build-test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache wasm-tools workload
        id: cache-wasm
        uses: actions/cache@v4
        with:
          path: |
            /usr/share/dotnet/metadata
            /usr/share/dotnet/packs
            /usr/share/dotnet/library-packs
          key: wasm-tools-${{ runner.os }}-${{ env.DOTNET_VERSION }}

      - name: Install wasm-tools workload
        if: steps.cache-wasm.outputs.cache-hit != 'true'
        run: dotnet workload install wasm-tools

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.slnx') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore RVS.slnx

      - name: Build solution
        run: dotnet build RVS.slnx --configuration Release

      # The Tests/ projects run on Microsoft.Testing.Platform (xunit.v3 + the
      # TestingPlatformDotnetTestSupport switch in Tests/Directory.Build.props).
      # trx / coverage flags are MTP syntax, passed after `--`; the legacy VSTest
      # `--logger`/`--collect` forms silently discovered nothing. See issue #560.
      - name: Run Domain tests with coverage
        run: >-
          dotnet test Tests/RVS.Domain.Tests/RVS.Domain.Tests.csproj
          --configuration Release
          --no-build
          --
          --report-trx --report-trx-filename domain-results.trx
          --coverage --coverage-output-format cobertura --coverage-output domain.cobertura.xml
          --results-directory ${{ github.workspace }}/TestResults

      - name: Run API tests with coverage
        run: >-
          dotnet test Tests/RVS.API.Tests/RVS.API.Tests.csproj
          --configuration Release
          --no-build
          --
          --report-trx --report-trx-filename api-results.trx
          --coverage --coverage-output-format cobertura --coverage-output api.cobertura.xml
          --results-directory ${{ github.workspace }}/TestResults

      - name: Run UI Shared tests with coverage
        run: >-
          dotnet test Tests/RVS.UI.Shared.Tests/RVS.UI.Shared.Tests.csproj
          --configuration Release
          --no-build
          --
          --report-trx --report-trx-filename ui-shared-results.trx
          --coverage --coverage-output-format cobertura --coverage-output ui-shared.cobertura.xml
          --results-directory ${{ github.workspace }}/TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults/**/*.trx
          retention-days: 14

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: ./TestResults/**/*.cobertura.xml
          retention-days: 14
