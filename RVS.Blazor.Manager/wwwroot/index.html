<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RVS Service Flow</title>
    <base href="/" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="_content/RVS.UI.Shared/css/design-tokens.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link href="RVS.Blazor.Manager.styles.css" rel="stylesheet" />
    <!-- Installable PWA (issue #498) -->
    <meta name="theme-color" content="#1565C0" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
</head>

<!-- No inline <script> anywhere in this file: the Content-Security-Policy in
     staticwebapp.config.json forbids it. Put script in wwwroot/js/ instead. -->
<body>
    <div id="app">
        <!-- Loading screen — replaced by Blazor once the WASM runtime initializes.
             js/splash-mode.js picks the full splash or the minimal post-login spinner. -->
        <script src="js/splash-mode.js"></script>
        <style>
            #splash-bg {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                font-family: Roboto, Helvetica, Arial, sans-serif;
                background:
                    url('images/tetons-mobile.jpg') center 25% / cover no-repeat;
            }
            @media (min-width: 768px) {
                #splash-bg {
                    background:
                        url('images/tetons-desktop.jpg') center 40% / cover no-repeat;
                }
            }
            /* Minimal splash on return from auth callback — plain background, spinner only */
            html[data-splash="minimal"] #splash-bg {
                background: #FAFAFA;
                min-height: 100vh;
            }
            html[data-splash="minimal"] #splash-bg .splash-brand { display: none; }
            html[data-splash="minimal"] .splash-bar > div { background: #3F51B5; }
            @keyframes loading-progress {
                0%   { transform: translateX(-150%); }
                100% { transform: translateX(350%); }
            }
        </style>
        <div id="splash-bg">
            <div class="splash-brand">
                <h3 style="margin:0 0 8px;font-weight:500;font-size:1.5rem;color:#ffffff;text-shadow:0 2px 4px rgba(0,0,0,0.5);">
                    RVS Service Flow
                </h3>
                <p style="margin:0 0 24px;font-size:0.875rem;color:#e0e0e0;text-shadow:0 1px 3px rgba(0,0,0,0.5);text-align:center;">
                    Loading application&hellip;
                </p>
            </div>
            <div class="splash-bar" style="width:200px;height:4px;background:rgba(255,255,255,0.3);border-radius:2px;overflow:hidden;"
                 role="progressbar" aria-label="Loading application">
                <div style="width:40%;height:100%;background:#ffffff;border-radius:2px;
                            animation:loading-progress 1.5s ease-in-out infinite;"></div>
            </div>
            <!-- Reserves the same vertical space as AuthStatePanel's (hidden) MudButton Size.Large
                 so the centered stack lines up identically and the swap to AuthStatePanel is jank-free. -->
            <div aria-hidden="true" style="margin-top:24px;height:42px;visibility:hidden;"></div>
        </div>
    </div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <!-- Must precede AuthenticationService.js: restores the persisted sign-in before the library reads it (issue #498). -->
    <script src="js/session-persist.js"></script>
    <script src="_content/Microsoft.AspNetCore.Components.WebAssembly.Authentication/AuthenticationService.js"></script>

    <!-- Application Insights JS SDK v3 — connection string read from appsettings.json by js/app-insights.js -->
    <script src="https://js.monitor.azure.com/scripts/b/ai.3.gbl.min.js"></script>
    <script src="js/app-insights.js"></script>

    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="js/download.js"></script>
    <script src="js/auth-refresh.js"></script>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script src="js/blazor-start.js"></script>
</body>

</html>
