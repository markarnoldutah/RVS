<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RV Intake Manager</title>
    <base href="/" />
    <!-- Self-hosted Space Grotesk (Spec THEME-1): the intake PWA has to render in brand
         from cache in a service bay, so no Google Fonts CDN dependency here. -->
    <link href="_content/RVS.UI.Shared/fonts/fonts.css" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="_content/RVS.UI.Shared/css/design-tokens.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link href="RVS.Blazor.Manager.styles.css" rel="stylesheet" />
    <!-- Installable PWA (issue #498) -->
    <meta name="theme-color" content="#2F4C6B" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-180x180.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
</head>

<!-- No inline <script> anywhere in this file: the Content-Security-Policy in
     staticwebapp.config.json forbids it. Put script in wwwroot/js/ instead. -->
<body>
    <div id="app">
        <!-- Loading screen — replaced by Blazor once the WASM runtime initializes.
             js/splash-mode.js picks the full splash or the minimal post-login spinner, and
             grounds both in the theme the user last chose. -->
        <script src="js/splash-mode.js"></script>
        <style>
            /* A plain surface, not a photograph. Manager is an all-hours console, and a
               cover-scaled hero re-scaled and flashed through every authentication state
               change — splash, AuthStatePanel, app (#703). All three now paint the same
               ground, so the only thing that changes is the content.

               These hex values mirror ManagerTheme's Background / TextPrimary / Primary
               (RvsBrand, Spec THEME-1) and are repeated here only because this markup
               renders before MudThemeProvider exists. Change them with RvsBrand.cs. */
            #splash-bg {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                font-family: 'Space Grotesk', Roboto, Helvetica, Arial, sans-serif;
                background: #FAF8F3;            /* RvsBrand.PaperNeutral */
                color: #20344A;                 /* RvsBrand.TextOnPaper */
                --splash-track: rgba(32, 52, 74, 0.26);
                --splash-bar: #C1502E;          /* RvsBrand.Accent */
            }
            html[data-theme="dark"] #splash-bg {
                background: #1B2A3C;            /* RvsBrand.InkDarkSurface */
                color: #F0ECE1;                 /* RvsBrand.TextOnInk */
                --splash-track: rgba(240, 236, 225, 0.35);
                --splash-bar: #E8956D;          /* RvsBrand.AccentOnDark */
            }
            html[data-theme="highcontrast"] #splash-bg {
                background: #000000;
                color: #FFFFFF;
                --splash-track: #666666;
                --splash-bar: #FFFF00;
            }
            /* Minimal splash on return from the auth callback — same ground, bar only. */
            html[data-splash="minimal"] #splash-bg .splash-brand { display: none; }
            .splash-brand h3 {
                margin: 0 0 8px;
                font-weight: 500;
                font-size: 1.5rem;
            }
            .splash-brand p {
                margin: 0 0 24px;
                font-size: 0.875rem;
                text-align: center;
                opacity: 0.7;
            }
            .splash-bar {
                width: 200px;
                height: 4px;
                background: var(--splash-track);
                border-radius: 2px;
                overflow: hidden;
            }
            .splash-bar > div {
                width: 40%;
                height: 100%;
                background: var(--splash-bar);
                border-radius: 2px;
                animation: loading-progress 1.5s ease-in-out infinite;
            }
            @keyframes loading-progress {
                0%   { transform: translateX(-150%); }
                100% { transform: translateX(350%); }
            }
        </style>
        <div id="splash-bg">
            <div class="splash-brand">
                <h3>RV Intake Manager</h3>
                <p>Loading application&hellip;</p>
            </div>
            <div class="splash-bar" role="progressbar" aria-label="Loading application">
                <div></div>
            </div>
            <!-- Reserves the same vertical space as AuthStatePanel's (hidden) MudButton Size.Large
                 so the centered stack lines up identically and the swap to AuthStatePanel is jank-free. -->
            <div aria-hidden="true" style="margin-top:24px;height:42px;visibility:hidden;"></div>
        </div>
    </div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <!-- Must precede AuthenticationService.js: restores the persisted sign-in before the library reads it (issue #498). -->
    <script src="js/session-persist.js"></script>
    <script src="_content/Microsoft.AspNetCore.Components.WebAssembly.Authentication/AuthenticationService.js"></script>

    <!-- Application Insights JS SDK v3 — connection string read from appsettings.json by js/app-insights.js -->
    <script src="https://js.monitor.azure.com/scripts/b/ai.3.gbl.min.js"></script>
    <script src="js/app-insights.js"></script>

    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="js/download.js"></script>
    <script src="js/auth-refresh.js"></script>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script src="js/blazor-start.js"></script>
</body>

</html>
